<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="modeBar" id="modeBar">
        <button type="button" class="modeBtn" data-mode="prueba">🧪 Prueba</button>
        <button type="button" class="modeBtn" data-mode="estudiante">🎓 Estudiante</button>
    </div>

    <!-- El render solo reemplaza el contenido de #view, nunca el de #app.
         Cualquier hook del proctoring debe montarse fuera de #view para
         sobrevivir a los re-render. -->
    <main id="app" class="formContainer"><div id="view"></div></main>

    <aside class="floatingMenu">
        <button id="addQuestionBtn" title="Añadir pregunta">
            <span class="plusIcon">+</span>
        </button>
    </aside>

    <!--
      Los .js se cargan con un timestamp en vez de con <script src> fijo.

      Motivo: sin build step, el navegador cachea los scripts. Una recarga
      normal puede mezclar un state.js viejo con un exam.js nuevo, y como los
      simbolos compartidos viven en state.js, todo lo que los usa revienta con
      "toArray is not a function", lo que se ve como botones que no hacen
      nada. Poner ?v=2 no alcanza, porque un index.html viejo ni siquiera ve
      ese query.

      Date.now() fuerza una peticion nueva en cada carga. Los scripts se
      encadenan por onload para respetar el orden state -> editor -> exam -> app,
      que es el que necesita App.init().
    -->
    <script>
        (function boot() {
            var FILES = ['state', 'editor', 'exam', 'app'];

            function fatal(titulo, detalle) {
                var box = document.createElement('div');
                box.className = 'card';
                box.style.margin = '80px auto';
                box.style.maxWidth = '620px';

                var h = document.createElement('h2');
                h.textContent = titulo;
                var p = document.createElement('p');
                p.textContent = detalle;
                var r = document.createElement('p');
                var b = document.createElement('strong');
                b.textContent = 'Recargá con Ctrl+Shift+R para ignorar la caché';
                r.appendChild(b);
                r.appendChild(document.createTextNode(' y volvé a intentar.'));

                box.appendChild(h);
                box.appendChild(p);
                box.appendChild(r);
                (document.getElementById('app') || document.body).appendChild(box);
            }

            function load(i) {
                if (i === FILES.length) {
                    if (typeof App === 'undefined' || typeof App.init !== 'function') {
                        return fatal('No se pudo inicializar la aplicación',
                            'js/app.js se cargó pero no definió App.init().');
                    }
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', App.init);
                    } else {
                        App.init();
                    }
                    return;
                }

                var name = FILES[i];
                var s = document.createElement('script');
                s.src = 'js/' + name + '.js?t=' + Date.now();
                s.onload = function () { load(i + 1); };
                s.onerror = function () {
                    fatal('No se pudo cargar ' + name + '.js',
                        'El archivo js/' + name + '.js no se encontró o no se pudo leer.');
                };
                document.head.appendChild(s);
            }

            load(0);
        })();
    </script>
</body>

</html>
