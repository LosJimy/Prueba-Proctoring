<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="modeBar" id="modeBar">
        <button type="button" class="modeBtn" data-mode="prueba">🧪 Prueba</button>
        <button type="button" class="modeBtn" data-mode="estudiante">🎓 Estudiante</button>
    </div>

    <main id="app" class="formContainer"></main>

    <aside class="floatingMenu">
        <button id="addQuestionBtn" title="Añadir pregunta">
            <span class="plusIcon">+</span>
        </button>
    </aside>

    <script src="js/state.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/exam.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
