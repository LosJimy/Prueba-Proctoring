<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="modeBar" id="modeBar">
        <button type="button" class="modeBtn" data-mode="prueba">🧪 Prueba</button>
        <button type="button" class="modeBtn" data-mode="estudiante">🎓 Estudiante</button>
    </div>

    <!-- El render solo reemplaza el contenido de #view, nunca el de #app.
         Cualquier hook del proctoring debe montarse fuera de #view para
         sobrevivir a los re-render. -->
    <main id="app" class="formContainer"><div id="view"></div></main>

    <aside class="floatingMenu">
        <button id="addQuestionBtn" title="Añadir pregunta">
            <span class="plusIcon">+</span>
        </button>
    </aside>

    <!-- Sin build step, el navegador cachea los .js y una version vieja de
         state.js con un exam.js nuevo rompe todo en runtime (toArray undefined).
         Hay que subir v= a mano cada vez que se toquen los scripts. -->
    <script src="js/state.js?v=2"></script>
    <script src="js/editor.js?v=2"></script>
    <script src="js/exam.js?v=2"></script>
    <script src="js/app.js?v=2"></script>
</body>

</html>
